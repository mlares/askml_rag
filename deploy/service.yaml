apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: askml
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 4
      timeoutSeconds: 30
      serviceAccountName: askml-runner@askml-505521.iam.gserviceaccount.com
      containers:
        - image: southamerica-east1-docker.pkg.dev/askml-505521/askml-images/askml@sha256:124bbcf1630c1e4d17ffb0f8c0f8abf5e689535ed07637b44fd33520440f9919
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-api-key
                  key: latest
            - name: BOOKING_URL
              value: https://calendly.com/marcelo-lares/30min
          startupProbe:
            httpGet:
              path: /ready
              port: 8080
            failureThreshold: 12
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 3
            periodSeconds: 10
