[project]
name = "askml-rag"
version = "0.1.0"
description = "Evaluation-first RAG over a curated professional and scientific corpus"                                                                                                                                                                                          
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.1",
    "langchain>=1.3.14",
    "markdownify>=1.2.3",
    "matplotlib>=3.11.1",
    "openai>=2.46.0",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "pymupdf>=1.28.0",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.18.0",
    "rank-bm25>=0.2.2",
    "rich-theme-manager>=0.11.0",
    "sentence-transformers>=5.6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[build-system]
    requires = ["hatchling"]
    build-backend = "hatchling.build"
