# The following questions are reverse-authored. Each answerable
# entry was derived by inspecting its labelled chunks, rather than by asking a
# retriever to suggest evidence.  Review wording and claims before merging
# selected entries into the official benchmark and regenerating corpus_index.
  # Approach 1: contrast two evidence-backed tasks or systems.
  - question_id: comparison_deepz_vvv_001
    topic: cross_source_reasoning
    language: en
    question: >
      How did the machine-learning task and methods differ between the VVV/VVVX
      galaxy work and DEEPz?
    answerable: true
    answer_mode: passage
    category: comparison
    expected_document_ids:
      - website_projects
    relevant_chunk_ids:
      - website_projects_chunk_004
      - website_projects_chunk_006
    expected_claims:
      - claim: >
          The VVV/VVVX work identifies faint extended objects in crowded
          near-infrared images using CNNs and XGBoost with photometric and
          morphological features.
        source_document_ids:
          - website_projects
      - claim: >
          DEEPz estimates continuous photometric redshifts from noisy,
          incomplete measurements using transfer learning, mixture density
          networks, autoencoders, and ensemble models.
        source_document_ids:
          - website_projects
    difficulty: comparison
    notes: Reverse-authored contrast between classification/detection and regression.

